[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

[dev]
  command = "npm run dev"
  targetPort = 5173

[[redirects]]
  from = "/planner"
  to   = "/planner.html"
  status = 200

[[redirects]]
  from = "/itinerary"
  to   = "/itinerary.html"
  status = 200

[[redirects]]
  from = "/destinations"
  to   = "/destinations.html"
  status = 200

[[redirects]]
  from = "/budget"
  to   = "/budget.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-XSS-Protection = "1; mode=block"
    Referrer-Policy = "strict-origin-when-cross-origin"
